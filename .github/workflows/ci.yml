name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - run: go vet ./...
      - run: go test -race ./...
        # -race needs cgo, which windows-latest lacks by default
        if: runner.os != 'Windows'
      - run: go test ./...
        if: runner.os == 'Windows'

  ts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 24]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
        if: runner.os != 'Windows'
      # The fake-REPL tests use POSIX shell scripts; on Windows run the pure tests only.
      - run: npx tsc -p tsconfig.test.json && node --test build-test/test/utils.test.js build-test/test/interface.test.js build-test/test/filelock.test.js
        if: runner.os == 'Windows'

  e2e:
    name: e2e (real Lean, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      LEAN_INTERACT_CACHE_DIR: ${{ github.workspace }}/.lean-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: |
            .lean-cache
            ~/.elan/toolchains
          key: lean-e2e-${{ runner.os }}-${{ github.run_id }}
          restore-keys: lean-e2e-${{ runner.os }}-
      - name: Go e2e
        working-directory: go
        run: LEAN_INTERACT_E2E=1 go test -race -run TestE2E -timeout 30m ./...
      - name: TypeScript e2e
        working-directory: ts
        run: |
          npm ci
          npm run test:e2e
